name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Encrypt / pack CV content
        # All three secrets are optional. Without SITE_PASSWORD the gate is
        # bypassed; without CV_SOURCE_JSON / CV_PORTRAIT_BASE64 the lorem-ipsum
        # placeholder CV and a blank portrait are used. The repo itself only
        # ever contains placeholder data.
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CV_SOURCE_JSON: ${{ secrets.CV_SOURCE_JSON }}
          CV_PORTRAIT_BASE64: ${{ secrets.CV_PORTRAIT_BASE64 }}
        run: node scripts/encrypt-cv.mjs

      - name: Build static site
        run: bun run build:static

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
