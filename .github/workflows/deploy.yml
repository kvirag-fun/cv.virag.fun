name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Check secrets are visible to this job
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CV_SOURCE_JSON: ${{ secrets.CV_SOURCE_JSON }}
          CV_PORTRAIT_BASE64: ${{ secrets.CV_PORTRAIT_BASE64 }}
        run: |
          echo "SITE_PASSWORD chars:       ${#SITE_PASSWORD}"
          echo "CV_SOURCE_JSON chars:      ${#CV_SOURCE_JSON}"
          echo "CV_PORTRAIT_BASE64 chars:  ${#CV_PORTRAIT_BASE64}"
          if [ "${#SITE_PASSWORD}" -lt 8 ]; then
            echo "::error::SITE_PASSWORD is missing or shorter than 8 characters. Add it as a *repository* secret (Settings -> Secrets and variables -> Actions -> Repository secrets), not a variable and not environment-scoped."
            exit 1
          fi

      - name: Build static site
        # `bun run build` invokes the prebuild encryption script. Keep the
        # secrets in this step so that prebuild does not overwrite the encrypted
        # payload with the committed lorem-ipsum fallback.
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CV_SOURCE_JSON: ${{ secrets.CV_SOURCE_JSON }}
          CV_PORTRAIT_BASE64: ${{ secrets.CV_PORTRAIT_BASE64 }}
        run: bun run build:static

      - name: Verify the built payload is encrypted
        run: |
          if grep -q "locked: true" src/lib/cv-payload.ts; then
            echo "Payload is encrypted."
          else
            echo "::error::Build produced an OPEN (unencrypted) payload — SITE_PASSWORD did not reach the encryption step."
            exit 1
          fi
          if grep -rq "locked: false" dist/client/assets/*.js 2>/dev/null; then
            echo "::error::An open payload leaked into the built assets."
            exit 1
          fi


      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
